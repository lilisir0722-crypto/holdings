<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ name }} · 技术</title>
  <style>
    :root {
      --paper: #f3ead8;
      --ink: #1b1712;
      --muted: #6b6256;
      --rule: #c9bba3;
      --up: #b42318;
      --down: #1f6b45;
      --stamp: #9b1c1c;
      --card: #faf6ee;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Palatino, serif;
      line-height: 1.55;
      display: flex;
      flex-direction: column;
    }
    .wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 16px 24px 12px;
      display: flex;
      flex-direction: column;
    }
    .tech-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .lede {
      border-left: 3px solid var(--ink);
      padding: 8px 0 8px 16px;
      margin: 0 0 22px;
    }
    .tech-stance { margin: 8px 0 22px; }
    .tech-stance h3 { margin: 0 0 8px; font-size: 20px; }
    .tech-tomorrow { border-left-color: #6b4f2a; }
    .tech-intent { border-left-color: #6b2a2a; }
    .tech-intent h3 { margin: 0 0 8px; font-size: 20px; }
    .tech-group { margin: 0 0 22px; }
    .tech-group h4 {
      margin: 0 0 10px;
      letter-spacing: 0.16em;
      font-size: 13px;
      color: var(--muted);
      border-bottom: 1px solid var(--rule);
      padding-bottom: 6px;
    }
    .tech-group.quiet summary {
      cursor: pointer; color: var(--muted); margin-bottom: 10px;
      font-size: 14px; letter-spacing: 0.08em;
    }
    .tech-item { border-top: 1px solid var(--rule); padding: 10px 0; }
    .tech-item strong { display: block; margin-bottom: 2px; }
    .tech-item p { margin: 0 0 4px; }
    .tech-item .tech-about { color: var(--muted); font-size: 13px; line-height: 1.45; margin-bottom: 6px; }
    .tech-item.signal strong { color: var(--stamp); }
    .tech-model { border-left-color: #2a4a6b; margin: 12px 0 20px; }
    .tech-model h4 { margin: 0 0 6px; font-size: 14px; letter-spacing: 0.12em; }
    .tech-model p { margin: 0 0 6px; }
    .evidence { margin: 0; padding-left: 1.2em; color: var(--muted); font-size: 14px; font-family: "Iowan Old Style", Palatino, serif; }
    .evidence li { margin: 0 0 4px; }
    .code { color: var(--muted); font-family: "IBM Plex Mono", "Menlo", monospace; font-size: 13px; letter-spacing: 0.04em; }
    .err { color: var(--stamp); margin-bottom: 16px; }
    .meta { font-size: 12px; color: var(--muted); }
    .meta a { color: var(--muted); }
    .meta a:hover { color: var(--stamp); }
    .tech-head { flex-shrink: 0; }
    .tech-head h2 { margin: 0 0 6px; font-size: 24px; }
    .chanlun-chart-wrap { margin: 12px 0 16px; }
    .chanlun-chart-wrap canvas {
      display: block;
      width: 100%;
      height: 320px;
      background: var(--card);
      border: 1px solid var(--rule);
    }
    .chanlun-legend { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
    .chanlun-tip { min-height: 1.4em; margin: 6px 0 0; font-size: 13px; color: var(--ink); }
    .plan-table { width: 100%; border-collapse: collapse; margin: 10px 0 4px; font-size: 14px; }
    .plan-table td { border-top: 1px solid var(--rule); padding: 7px 8px 7px 0; vertical-align: top; }
    .plan-table td:first-child { width: 52%; }
    .plan-table td:last-child { color: var(--muted); font-family: "Iowan Old Style", Palatino, serif; }
    .check-form { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--rule); }
    .check-form .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    .check-form label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }
    .check-form input, .check-form select {
      font-family: "IBM Plex Mono", Menlo, monospace;
      font-size: 14px;
      padding: 6px 8px;
      border: 1px solid var(--rule);
      background: var(--card);
      color: var(--ink);
      min-width: 90px;
    }
    .check-form button {
      font-family: inherit;
      background: var(--ink);
      color: var(--paper);
      border: 0;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
    }
    .slot { min-height: 0; }
    .slot.pending { margin: 0 0 14px; }
    .slot:empty { display: none; }
    .tech-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      margin: 12px 0 0;
      border-bottom: 1px solid var(--ink);
      flex-shrink: 0;
      background: var(--paper);
    }
    .tech-tabs button {
      appearance: none;
      background: none;
      border: 0;
      border-bottom: 2px solid transparent;
      margin: 0 4px -1px 0;
      padding: 8px 14px 10px;
      font-family: inherit;
      font-size: 14px;
      letter-spacing: 0.16em;
      color: var(--muted);
      cursor: pointer;
    }
    .tech-tabs button[aria-selected="true"] {
      color: var(--ink);
      border-bottom-color: var(--ink);
    }
    .tech-tabs button.waiting { opacity: 0.65; }
    .tech-pane {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .tab-panels {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }
    .tab-panel { padding: 16px 0 8px; }
    .tab-panel.is-off { display: none; }
    .tech-ask {
      flex: 0 0 auto;
      border-top: 2px solid var(--ink);
      margin-top: 8px;
      padding-top: 12px;
      background: var(--paper);
    }
    .tech-ask h4 { margin: 0 0 6px; letter-spacing: 0.12em; font-size: 14px; }
    .chat-log {
      margin: 0 0 10px;
      max-height: 18vh;
      overflow: auto;
    }
    .chat-msg { margin: 0 0 12px; }
    .chat-msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.06em; }
    .chat-msg .bubble {
      background: var(--card);
      border: 1px solid var(--rule);
      padding: 10px 12px;
    }
    .chat-msg.user .bubble { background: #efe6d4; }
    .md-body { font-size: 15px; line-height: 1.65; }
    .md-body p { margin: 0 0 10px; }
    .md-body p:last-child { margin-bottom: 0; }
    .md-body h3, .md-body h4 {
      margin: 14px 0 8px;
      font-size: 16px;
      letter-spacing: 0.04em;
    }
    .md-body h3:first-child, .md-body h4:first-child { margin-top: 0; }
    .md-body ul, .md-body ol { margin: 0 0 10px; padding-left: 1.3em; color: var(--ink); }
    .md-body li { margin: 0 0 4px; }
    .md-body strong { font-weight: 700; }
    .md-body code {
      font-family: "IBM Plex Mono", Menlo, monospace;
      font-size: 13px;
      background: #efe6d4;
      padding: 0 4px;
    }
    .md-body pre {
      font-family: "IBM Plex Mono", Menlo, monospace;
      font-size: 13px;
      background: #efe6d4;
      border: 1px solid var(--rule);
      padding: 8px 10px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .md-body pre code { background: none; padding: 0; }
    .chat-think {
      margin: 0 0 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .chat-think summary { cursor: pointer; }
    .chat-form .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-top: 8px; }
    .chat-form label {
      display: flex;
      flex-direction: column;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .chat-form select {
      font-family: "IBM Plex Mono", Menlo, monospace;
      font-size: 14px;
      padding: 6px 8px;
      border: 1px solid var(--rule);
      background: var(--card);
      color: var(--ink);
    }
    .chat-form textarea {
      display: block;
      width: 100%;
      min-height: 52px;
      font-family: inherit;
      font-size: 14px;
      padding: 8px;
      border: 1px solid var(--rule);
      background: var(--card);
      color: var(--ink);
      resize: vertical;
    }
    .chat-form button {
      font-family: inherit;
      background: var(--ink);
      color: var(--paper);
      border: 0;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
    }
    .chat-form button:disabled { opacity: 0.45; cursor: default; }
  </style>
</head>
<body data-code="{{ code }}">
  <div class="wrap">
    <p class="meta"><a href="/">← 返回持仓</a> · <a href="/journal/{{ code }}">历史快照</a></p>

    <section class="tech-body">
      {% if error %}
        <p class="err">{{ error }}</p>
      {% else %}
        <header class="tech-head">
          <h2>{{ name }} <span class="code">{{ kind }} {{ code }}</span></h2>
          {% if price %}
            <p class="meta">现价 {{ "%.4f"|format(price) }}</p>
          {% endif %}
        </header>
        <div class="tech-pane">
          <nav class="tech-tabs" role="tablist">
            <button type="button" role="tab" id="tab-plan" data-tab="plan" aria-selected="true" class="waiting">判断</button>
            <button type="button" role="tab" id="tab-intent" data-tab="intent" aria-selected="false" class="waiting">主力意图分析</button>
            <button type="button" role="tab" id="tab-note" data-tab="note" aria-selected="false" class="waiting">说明</button>
            <button type="button" role="tab" id="tab-extra" data-tab="extra" aria-selected="false" class="waiting">外部</button>
            <button type="button" role="tab" id="tab-chart" data-tab="chart" aria-selected="false" class="waiting">缠论</button>
          </nav>
          <div class="tab-panels">
            <section class="tab-panel" id="panel-plan" data-panel="plan">
              <div id="tech-core" class="slot pending"><p class="meta">在算日线和预案…</p></div>
            </section>
            <section class="tab-panel is-off" id="panel-intent" data-panel="intent">
              <div id="tech-intent" class="slot pending"><p class="meta">在对照资金和价格…</p></div>
            </section>
            <section class="tab-panel is-off" id="panel-note" data-panel="note">
              <div id="tech-note" class="slot pending"><p class="meta">说明还在写…</p></div>
            </section>
            <section class="tab-panel is-off" id="panel-extra" data-panel="extra">
              <div id="tech-extras" class="slot pending"><p class="meta">在拉外部参照…</p></div>
            </section>
            <section class="tab-panel is-off" id="panel-chart" data-panel="chart">
              <div id="tech-rest" class="slot"></div>
            </section>
          </div>
        </div>
        <section class="tech-ask" id="tech-chat">
          <h4>问这页</h4>
          <p class="meta">核心出来后才能问。每句都会带上这页当时已经算好的数据。刷新页面对话清空。</p>
          <div class="chat-log" id="chat-log"></div>
          <form class="chat-form" id="chat-form">
            <textarea id="chat-input" rows="2" placeholder="问这页的数据，比如防线、成本、能不能加" disabled></textarea>
            <div class="row">
              <label>模型
                <select id="chat-model">
                  <option value="deepseek-v4-flash">V4 Flash</option>
                  <option value="deepseek-v4-pro">V4 Pro</option>
                  <option value="deepseek-v4-flash-vision-exp">V4 Flash Vision（实验）</option>
                </select>
              </label>
              <button type="submit" id="chat-btn" disabled>问</button>
            </div>
          </form>
        </section>
      {% endif %}
    </section>
  </div>
  <script>
    (function () {
      var code = document.body.getAttribute("data-code") || "";
      if (!code || document.querySelector(".err")) return;
      var core = document.getElementById("tech-core");
      var extras = document.getElementById("tech-extras");
      var intent = document.getElementById("tech-intent");
      var note = document.getElementById("tech-note");
      var rest = document.getElementById("tech-rest");
      var chatInput = document.getElementById("chat-input");
      var chatBtn = document.getElementById("chat-btn");
      var chatForm = document.getElementById("chat-form");
      var chatLog = document.getElementById("chat-log");
      var chatModel = document.getElementById("chat-model");
      var history = [];
      var chanlunReady = false;
      function readyTab(name) {
        var btn = document.querySelector('.tech-tabs [data-tab="' + name + '"]');
        if (btn) btn.classList.remove("waiting");
      }
      function showChanlun() {
        if (!chanlunReady || !window.initChanlunChart) return;
        requestAnimationFrame(function () { window.initChanlunChart(); });
      }
      function selectTab(name) {
        document.querySelectorAll(".tech-tabs [data-tab]").forEach(function (btn) {
          btn.setAttribute("aria-selected", btn.getAttribute("data-tab") === name ? "true" : "false");
        });
        document.querySelectorAll(".tab-panel").forEach(function (panel) {
          panel.classList.toggle("is-off", panel.getAttribute("data-panel") !== name);
        });
        if (name === "chart") showChanlun();
      }
      document.querySelectorAll(".tech-tabs [data-tab]").forEach(function (btn) {
        btn.addEventListener("click", function () { selectTab(btn.getAttribute("data-tab")); });
      });
      try {
        var saved = localStorage.getItem("holdings-chat-model");
        if (chatModel && (
          saved === "deepseek-v4-flash"
          || saved === "deepseek-v4-pro"
          || saved === "deepseek-v4-flash-vision-exp"
        )) {
          chatModel.value = saved;
        }
      } catch (e) {}
      if (chatModel) {
        chatModel.addEventListener("change", function () {
          try { localStorage.setItem("holdings-chat-model", chatModel.value); } catch (err) {}
        });
      }
      function fill(el, html) {
        if (!el) return;
        el.classList.remove("pending");
        var trimmed = (html || "").trim();
        el.innerHTML = trimmed;
        if (!trimmed) el.innerHTML = "";
      }
      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function renderMarkdown(src) {
        var text = String(src || "").replace(/\r\n/g, "\n").trim();
        if (!text) return "";
        var fences = [];
        text = text.replace(/```[\w]*\n?([\s\S]*?)```/g, function (_, code) {
          fences.push("<pre><code>" + escapeHtml(code.replace(/\n$/, "")) + "</code></pre>");
          return "\n\n%%FENCE" + (fences.length - 1) + "%%\n\n";
        });
        var blocks = text.split(/\n{2,}/);
        return blocks.map(function (block) {
          var raw = block.trim();
          if (!raw) return "";
          if (/^%%FENCE\d+%%$/.test(raw)) {
            return fences[Number(raw.replace(/\D/g, ""))] || "";
          }
          if (/^#{1,3} /.test(raw)) {
            var depth = raw.match(/^#+/)[0].length;
            var title = escapeHtml(raw.replace(/^#{1,3} /, ""));
            return depth >= 3 ? "<h4>" + title + "</h4>" : "<h3>" + title + "</h3>";
          }
          var lines = escapeHtml(raw).split("\n");
          var html = "";
          var paras = [];
          var items = [];
          function flushPara() {
            if (!paras.length) return;
            html += "<p>" + inlineMd(paras.join("<br>")) + "</p>";
            paras = [];
          }
          function flushList() {
            if (!items.length) return;
            html += "<ul>" + items.join("") + "</ul>";
            items = [];
          }
          lines.forEach(function (ln) {
            var m = ln.match(/^(?:\d+[\.、]|[-*•])\s+(.*)$/) || ln.match(/^\d+、(.*)$/);
            if (m) {
              flushPara();
              items.push("<li>" + inlineMd(m[1]) + "</li>");
            } else {
              flushList();
              paras.push(ln);
            }
          });
          flushPara();
          flushList();
          return html;
        }).join("");
      }
      function inlineMd(s) {
        return s
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/`([^`]+)`/g, "<code>$1</code>");
      }
      function hydrateMarkdown(root) {
        if (!root) return;
        root.querySelectorAll(".md-json").forEach(function (node) {
          var raw = "";
          try { raw = JSON.parse(node.textContent || "\"\""); } catch (err) { raw = ""; }
          var out = node.nextElementSibling;
          if (out && out.classList.contains("md-out")) out.innerHTML = renderMarkdown(raw);
        });
      }
      function append(role, text, reasoning) {
        if (!chatLog) return;
        var wrap = document.createElement("div");
        wrap.className = "chat-msg " + role;
        var who = document.createElement("div");
        who.className = "who";
        who.textContent = role === "user" ? "我" : "模型";
        var bubble = document.createElement("div");
        bubble.className = "bubble";
        if (role === "assistant" && reasoning) {
          var think = document.createElement("details");
          think.className = "chat-think";
          think.innerHTML = "<summary>思考过程</summary><div class=\"md-body\">" + renderMarkdown(reasoning) + "</div>";
          bubble.appendChild(think);
        }
        var body = document.createElement("div");
        body.className = "md-body";
        if (role === "assistant") body.innerHTML = renderMarkdown(text);
        else body.textContent = text;
        bubble.appendChild(body);
        wrap.appendChild(who);
        wrap.appendChild(bubble);
        chatLog.appendChild(wrap);
        wrap.scrollIntoView({ block: "nearest" });
      }
      fetch("/tech/" + encodeURIComponent(code) + "/core")
        .then(function (r) { return r.text(); })
        .then(function (html) {
          var box = document.createElement("div");
          box.innerHTML = html;
          var lead = box.querySelector('[data-part="lead"]');
          var more = box.querySelector('[data-part="rest"]');
          if (lead || more) {
            fill(core, lead ? lead.innerHTML : "");
            fill(rest, more ? more.innerHTML : "");
          } else {
            fill(core, html);
          }
          chanlunReady = true;
          readyTab("plan");
          readyTab("chart");
          if (chatInput) chatInput.disabled = false;
          if (chatBtn) chatBtn.disabled = false;
          if (!document.getElementById("panel-chart").classList.contains("is-off")) showChanlun();
          return fetch("/tech/" + encodeURIComponent(code) + "/extras");
        })
        .then(function (r) { return r.text(); })
        .then(function (html) {
          var box = document.createElement("div");
          box.innerHTML = html;
          var extraPart = box.querySelector('[data-part="extra"]');
          var intentPart = box.querySelector('[data-part="intent"]');
          if (extraPart || intentPart) {
            fill(extras, extraPart ? extraPart.innerHTML : "");
            fill(intent, intentPart ? intentPart.innerHTML : "");
          } else {
            fill(extras, html);
          }
          var extraTm = extras.querySelector(".tech-tomorrow");
          var leadTm = core && core.querySelector(".tech-tomorrow");
          if (extraTm && leadTm) leadTm.replaceWith(extraTm);
          else if (extraTm) extraTm.remove();
          readyTab("extra");
          readyTab("intent");
          return fetch("/tech/" + encodeURIComponent(code) + "/note");
        })
        .then(function (r) { return r.text(); })
        .then(function (html) {
          fill(note, html);
          hydrateMarkdown(note);
          readyTab("note");
        })
        .catch(function (e) {
          if (core) core.innerHTML = "<p class=\"err\">这块没拉下来：" + e + "</p>";
        });
      if (chatForm) {
        chatForm.addEventListener("submit", function (ev) {
          ev.preventDefault();
          var msg = (chatInput && chatInput.value || "").trim();
          if (!msg || (chatInput && chatInput.disabled)) return;
          chatInput.value = "";
          var prev = history.slice();
          history.push({ role: "user", content: msg });
          append("user", msg);
          if (chatBtn) chatBtn.disabled = true;
          fetch("/tech/" + encodeURIComponent(code) + "/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: msg,
              history: prev,
              model: chatModel ? chatModel.value : "deepseek-v4-flash"
            })
          })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
            .then(function (x) {
              var text = (x.j && (x.j.text || x.j.error)) || "没回上来";
              var reasoning = (x.j && x.j.reasoning) || "";
              history.push({ role: "assistant", content: text });
              append("assistant", text, reasoning);
            })
            .catch(function (e) { append("assistant", "没问成：" + e); })
            .finally(function () { if (chatBtn) chatBtn.disabled = false; });
        });
      }
    })();
    window.initChanlunChart = function () {
      var node = document.getElementById("chanlun-data");
      var canvas = document.getElementById("chanlun-chart");
      if (!node || !canvas) return;
      if (window._chanlunDraw) {
        window._chanlunDraw();
        return;
      }
      var data;
      try { data = JSON.parse(node.textContent); } catch (e) { return; }
      var klines = data.klines || [];
      if (!klines.length) return;

      function day(s) { return (s || "").slice(0, 10); }
      var indexOf = {};
      klines.forEach(function (k, i) { indexOf[day(k.date)] = i; });

      var hits = [];
      var padL = 52, padR = 12, padT = 16, padB = 28;

      function layout() {
        var cssW = canvas.clientWidth || 800;
        var cssH = 320;
        var dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(cssW * dpr);
        canvas.height = Math.floor(cssH * dpr);
        canvas.style.width = cssW + "px";
        canvas.style.height = cssH + "px";
        var ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return { ctx: ctx, w: cssW, h: cssH };
      }

      function draw() {
        var L = layout();
        var ctx = L.ctx, w = L.w, h = L.h;
        hits = [];
        var plotW = w - padL - padR;
        var plotH = h - padT - padB;
        var ymin = Infinity, ymax = -Infinity;
        klines.forEach(function (k) {
          ymin = Math.min(ymin, k.low);
          ymax = Math.max(ymax, k.high);
        });
        (data.zss || []).forEach(function (z) {
          if (z.zd != null) ymin = Math.min(ymin, z.zd);
          if (z.zg != null) ymax = Math.max(ymax, z.zg);
        });
        if (!(ymax > ymin)) { ymax = ymin + 1; }
        var pad = (ymax - ymin) * 0.06;
        ymin -= pad; ymax += pad;
        function xOf(i) { return padL + (i + 0.5) * plotW / klines.length; }
        function yOf(p) { return padT + (ymax - p) / (ymax - ymin) * plotH; }
        function idx(date) {
          var i = indexOf[day(date)];
          return i == null ? -1 : i;
        }

        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "#faf6ee";
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = "#c9bba3";
        ctx.strokeRect(padL, padT, plotW, plotH);

        ctx.fillStyle = "#6b6256";
        ctx.font = "11px Palatino, serif";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        for (var g = 0; g < 4; g++) {
          var p = ymin + (ymax - ymin) * g / 3;
          var y = yOf(p);
          ctx.strokeStyle = "rgba(201,187,163,0.45)";
          ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
          ctx.fillText(p.toFixed(3), padL - 6, y);
        }

        var slot = plotW / klines.length;
        var cw = Math.max(1, slot * 0.62);
        klines.forEach(function (k, i) {
          var x = xOf(i);
          var up = k.close >= k.open;
          ctx.strokeStyle = up ? "#b42318" : "#1f6b45";
          ctx.fillStyle = up ? "#b42318" : "#1f6b45";
          ctx.beginPath();
          ctx.moveTo(x, yOf(k.high));
          ctx.lineTo(x, yOf(k.low));
          ctx.stroke();
          var y1 = yOf(Math.max(k.open, k.close));
          var y2 = yOf(Math.min(k.open, k.close));
          var bh = Math.max(1, y2 - y1);
          ctx.fillRect(x - cw / 2, y1, cw, bh);
        });

        ctx.globalAlpha = 0.22;
        (data.zss || []).forEach(function (z) {
          var a = idx(z.start_date), b = idx(z.end_date);
          if (a < 0) a = 0;
          if (b < 0) b = klines.length - 1;
          if (b < a) { var t = a; a = b; b = t; }
          var x1 = xOf(a) - cw / 2, x2 = xOf(b) + cw / 2;
          ctx.fillStyle = "#2a4a6b";
          ctx.fillRect(x1, yOf(z.zg), x2 - x1, yOf(z.zd) - yOf(z.zg));
        });
        ctx.globalAlpha = 1;

        ctx.lineWidth = 1.4;
        (data.bis || []).forEach(function (bi) {
          var a = idx(bi.start_date), b = idx(bi.end_date);
          if (a < 0 || b < 0) return;
          var up = bi.direction === "up";
          var y1 = yOf(up ? bi.low : bi.high);
          var y2 = yOf(up ? bi.high : bi.low);
          ctx.strokeStyle = up ? "#9b1c1c" : "#1f6b45";
          ctx.beginPath();
          ctx.moveTo(xOf(a), y1);
          ctx.lineTo(xOf(b), y2);
          ctx.stroke();
        });
        ctx.lineWidth = 1;

        (data.mmds || []).forEach(function (m) {
          var i = idx(m.date);
          if (i < 0) return;
          var buy = String(m.type || "").toLowerCase().indexOf("buy") >= 0
            || String(m.type || "").indexOf("买") >= 0;
          var x = xOf(i);
          var k = klines[i];
          var y = buy ? yOf(k.low) + 10 : yOf(k.high) - 10;
          ctx.fillStyle = buy ? "#b42318" : "#1f6b45";
          ctx.beginPath();
          if (buy) {
            ctx.moveTo(x, y + 6); ctx.lineTo(x - 5, y - 4); ctx.lineTo(x + 5, y - 4);
          } else {
            ctx.moveTo(x, y - 6); ctx.lineTo(x - 5, y + 4); ctx.lineTo(x + 5, y + 4);
          }
          ctx.closePath();
          ctx.fill();
          hits.push({ x: x, y: y, r: 10, text: (m.type || "") + " " + (m.date || "") + " " + (m.msg || "") });
        });

        ctx.fillStyle = "#6b6256";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        var step = Math.max(1, Math.floor(klines.length / 5));
        for (var i = 0; i < klines.length; i += step) {
          ctx.fillText(day(klines[i].date).slice(5), xOf(i), padT + plotH + 6);
        }
      }

      window._chanlunDraw = draw;
      draw();
      window.addEventListener("resize", draw);
      canvas.addEventListener("click", function (ev) {
        var rect = canvas.getBoundingClientRect();
        var x = ev.clientX - rect.left, y = ev.clientY - rect.top;
        var tip = document.getElementById("chanlun-tip");
        var found = null, best = 999;
        hits.forEach(function (h) {
          var d = Math.hypot(h.x - x, h.y - y);
          if (d < h.r && d < best) { best = d; found = h; }
        });
        if (tip) tip.textContent = found ? found.text : "";
      });
    };
  </script>
</body>
</html>
