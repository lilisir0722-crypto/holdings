[project]
name = "holdings"
version = "0.1.0"
description = "本地持仓：手填代码数量成本，行情自动拉，判断带依据"
requires-python = ">=3.10"
dependencies = [
    "easy-tdx",
    "fastapi>=0.110",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
holdings = "holdings.web:main"
holdings-job = "holdings.jobs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holdings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
